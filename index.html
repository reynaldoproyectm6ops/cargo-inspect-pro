<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cargo Inspect Pro | Acceso Restringido</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    
    <meta name="theme-color" content="#051529">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --amerijet-blue: #0A2540;
            --amerijet-blue-dark: #051529;
            --amerijet-red: #E11D48;
            --amerijet-red-hover: #BE123C;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --input-bg: #F8FAFC;
            --border-radius: 12px;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--amerijet-blue-dark) 0%, var(--amerijet-blue) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        /* BANNER DE CONEXIÓN (OFFLINE) */
        #offlineBanner {
            position: fixed; top: 0; left: 0; width: 100%; background: var(--amerijet-red); color: white;
            text-align: center; padding: 12px; font-weight: 800; font-size: 13px; z-index: 9999;
            transform: translateY(-100%); transition: transform 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
        }
        #offlineBanner.active { transform: translateY(0); }

        /* DISEÑO PREMIUM DE TARJETA (Efecto Cristal) */
        .login-wrapper {
            animation: fadeIn 0.6s ease-out;
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, var(--amerijet-red), #F43F5E);
            border-radius: 20px 20px 0 0;
        }

        .brand-logo-img { max-width: 220px; height: auto; margin-bottom: 10px; }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group { margin-bottom: 22px; text-align: left; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 15px;
            background-color: var(--input-bg);
            color: var(--text-main);
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .input-group input:focus {
            border-color: #3B82F6;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .input-group input::placeholder { color: #94A3B8; font-weight: 500; }

        .btn-primary {
            background: linear-gradient(135deg, var(--amerijet-red) 0%, var(--amerijet-red-hover) 100%);
            color: white; border: none; padding: 16px; width: 100%; border-radius: 10px;
            font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; margin-top: 15px; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(225, 29, 72, 0.4); }
        .btn-primary:active:not(:disabled) { transform: translateY(1px); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        /* BOTÓN BIOMÉTRICO (FACEID / TOUCHID) */
        .btn-biometric {
            background: #F1F5F9; color: var(--amerijet-blue);
            border: 2px solid #CBD5E1; padding: 14px; width: 100%; border-radius: 10px;
            font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 15px;
            transition: all 0.3s ease; display: none; /* Se activa por JS si es compatible */
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-biometric:hover { background: #E2E8F0; border-color: #94A3B8; }

        /* BOTÓN CONTINUAR (SESIÓN ACTIVA) */
        .btn-continue {
            background: #10B981; color: white; border: none; padding: 16px; width: 100%; border-radius: 10px;
            font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; margin-top: 15px; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-continue:hover { background: #059669; transform: translateY(-2px); }

        .btn-text {
            background: transparent; border: none; color: #64748B; font-weight: 700;
            font-size: 13px; cursor: pointer; margin-top: 20px; text-decoration: underline;
        }
        .btn-text:hover { color: var(--amerijet-red); }

        .footer-note { margin-top: 30px; font-size: 11px; color: #94A3B8; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 5px; }

        /* MODALES ALERTA */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.7); display: none; justify-content: center; align-items: center; z-index: 3000; backdrop-filter: blur(4px); padding: 15px; }
        .modal-content { background: white; padding: 30px; border-radius: var(--border-radius); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .login-card { padding: 35px 25px; }
            .brand-logo-img { max-width: 180px; }
        }
    </style>
</head>
<body>

    <!-- BANNER DE CONEXIÓN (OFFLINE) -->
    <div id="offlineBanner">⚠️ SIN CONEXIÓN A INTERNET. ESPERANDO RED...</div>

    <div class="login-wrapper">
        <div class="login-card">
            <img src="logo.png" alt="Amerijet Logo" class="brand-logo-img">
            <p class="subtitle">Control de Rampa Integrado</p>

            <!-- PANEL 1: INICIO DE SESIÓN MANUAL / BIOMÉTRICO -->
            <div id="panelLoginForm">
                <form id="loginForm">
                    <div class="input-group">
                        <label for="username">Nombre de Usuario</label>
                        <!-- autocomplete triggers native keychain behavior seamlessly -->
                        <input type="text" id="username" placeholder="Ej: reynaldo" required autocomplete="username">
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña de Seguridad</label>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-primary" id="submitBtn">Ingresar al Sistema</button>
                </form>
                
                <!-- BOTÓN BIOMÉTRICO OCULTO POR DEFECTO -->
                <button type="button" class="btn-biometric" id="btnBiometric" onclick="loginBiometrico()">
                    <span style="font-size: 20px;">👤</span> Ingresar con FaceID / Huella
                </button>
            </div>

            <!-- PANEL 2: SESIÓN VIVA ENCONTRADA (ZERO-BYPASS) -->
            <div id="panelSessionActive" style="display: none;">
                <div style="background: #F1F5F9; border: 1px dashed #CBD5E1; padding: 20px; border-radius: 12px; margin-bottom: 15px;">
                    <div style="font-size: 30px; margin-bottom: 10px;">👋</div>
                    <h3 style="color: var(--amerijet-blue); font-size: 16px; font-weight: 900; margin-bottom: 5px;">Sesión Activa Detectada</h3>
                    <p style="color: #64748B; font-size: 13px; font-weight: 600;" id="lblUserEmail">Cargando usuario...</p>
                </div>
                <button class="btn-continue" onclick="window.location.href='dashboard.html'">🚀 Continuar al Dashboard</button>
                <button class="btn-text" onclick="cerrarSesionActual()">Cerrar sesión e ingresar con otra cuenta</button>
            </div>

            <div class="footer-note">🔒 Acceso exclusivo para personal autorizado</div>
        </div>
    </div>

    <!-- MODAL ALERTAS PERSONALIZADO -->
    <div class="modal-overlay" id="customAlertModal">
        <div class="modal-content">
            <div id="alertIcon" style="font-size: 40px; margin-bottom: 10px;">ℹ️</div>
            <h3 id="alertTitle" style="font-weight: 800; margin-bottom: 10px; font-size: 20px;">Título</h3>
            <p id="alertMessage" style="font-size: 13px; color: #475569; margin-bottom: 25px; line-height: 1.5;">Mensaje</p>
            <button onclick="document.getElementById('customAlertModal').style.display='none'" id="alertBtn" style="color:white; border:none; padding:12px; width:100%; border-radius:8px; cursor:pointer; font-weight:700; font-size: 14px; transition: 0.2s;">Aceptar</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CARGA SEGURA DE SUPABASE (EVITA CRASHES)
        // ==========================================
        let supabaseClient = null;

        function getSupabase() {
            if (supabaseClient) return supabaseClient;
            if (!window.supabase) return null; // Previene que el código se rompa si el internet falla y la librería no cargó

            const supabaseUrl = 'https://pedofgikkrkbwjpjzvac.supabase.co';
            const supabaseKey = 'sb_publishable_fFvJtjHlJezPpNVTIUivsA_2CZY86e7';
            supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
            return supabaseClient;
        }

        function showCustomAlert(title, message, type = 'info') {
            const modal = document.getElementById('customAlertModal');
            document.getElementById('alertTitle').innerText = title; document.getElementById('alertMessage').innerHTML = message;
            document.getElementById('alertIcon').innerText = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
            document.getElementById('alertTitle').style.color = type === 'error' ? '#E11D48' : (type === 'success' ? '#10B981' : '#0A2540');
            document.getElementById('alertBtn').style.background = type === 'error' ? '#E11D48' : (type === 'success' ? '#10B981' : '#0A2540');
            modal.style.display = 'flex';
        }

        // ==========================================
        // DETECCIÓN DE RED EN VIVO (OFFLINE MODE)
        // ==========================================
        const offlineBanner = document.getElementById('offlineBanner');
        function updateNetworkStatus() {
            if (navigator.onLine) {
                if (offlineBanner) offlineBanner.classList.remove('active');
                document.getElementById('submitBtn').disabled = false;
            } else {
                if (offlineBanner) offlineBanner.classList.add('active');
                document.getElementById('submitBtn').disabled = true;
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        // ==========================================
        // ZERO-BYPASS: VERIFICAR SESIÓN ACTIVA
        // ==========================================
        async function verificarSesion() {
            const supabase = getSupabase();
            if (!supabase) return; // Si la librería aún no carga, aborta silenciosamente.

            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (session && session.user) {
                    document.getElementById('panelLoginForm').style.display = 'none';
                    document.getElementById('panelSessionActive').style.display = 'block';
                    document.getElementById('lblUserEmail').innerText = session.user.email;
                } else {
                    // Activar botón biométrico si el navegador lo soporta de forma nativa
                    if (window.PasswordCredential && navigator.credentials) {
                        document.getElementById('btnBiometric').style.display = 'flex';
                    }
                }
            } catch (err) { console.error("Error validando sesión:", err); }
        }

        async function cerrarSesionActual() {
            const supabase = getSupabase();
            if(supabase) await supabase.auth.signOut();
            window.location.reload();
        }

        // ==========================================
        // LÓGICA DE INGRESO MANUAL Y GUARDADO BIOMÉTRICO
        // ==========================================
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Detiene el refresco nativo de la página
            
            if (!navigator.onLine) return showCustomAlert("Sin Red", "No puedes iniciar sesión sin internet.", "error");

            const supabase = getSupabase();
            const btnSubmit = document.getElementById('submitBtn');

            if (!supabase) {
                showCustomAlert("Error de Conexión", "No se pudo conectar con el servidor de autenticación. Verifica tu red y vuelve a intentarlo.", "error");
                return;
            }

            const rawUsername = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const secureEmail = rawUsername.includes('@') ? rawUsername : `${rawUsername}@cargo.com`;

            btnSubmit.innerHTML = '⏳ Autenticando...';
            btnSubmit.disabled = true;
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: secureEmail,
                    password: password,
                });

                if (error) {
                    showCustomAlert("Acceso Denegado", "Usuario o contraseña incorrectos. Verifica tus credenciales.", "error");
                    btnSubmit.innerHTML = 'Ingresar al Sistema';
                    btnSubmit.disabled = false;
                } else {
                    // ÉXITO: Ofrecer guardar las credenciales en el Llavero Biométrico del celular
                    if (window.PasswordCredential && navigator.credentials) {
                        try {
                            let cred = new PasswordCredential({
                                id: secureEmail,
                                password: password,
                                name: rawUsername
                            });
                            await navigator.credentials.store(cred);
                        } catch(e) { console.warn("Llavero del navegador ignoró la solicitud", e); }
                    }

                    btnSubmit.innerHTML = '✅ Acceso Concedido';
                    btnSubmit.style.background = 'linear-gradient(135deg, #10B981 0%, #059669 100%)';
                    
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
                }
            } catch (err) {
                showCustomAlert("Fallo del Sistema", "Error de comunicación: " + err.message, "error");
                btnSubmit.innerHTML = 'Ingresar al Sistema';
                btnSubmit.disabled = false;
            }
        });

        // ==========================================
        // LÓGICA DE INGRESO BIOMÉTRICO (FACEID/HUELLA)
        // ==========================================
        async function loginBiometrico() {
            if (!navigator.onLine) return showCustomAlert("Sin Red", "No puedes iniciar sesión sin internet.", "error");

            if (!navigator.credentials) {
                showCustomAlert("No Soportado", "Tu dispositivo o navegador no soporta el llavero biométrico o no estás en una conexión segura (HTTPS).", "info");
                return;
            }

            const supabase = getSupabase();
            if (!supabase) return showCustomAlert("Error de Red", "El servidor de autenticación no está listo.", "error");

            try {
                // Llama al FaceID / TouchID nativo del SO para extraer la contraseña guardada
                const cred = await navigator.credentials.get({ 
                    password: true, 
                    mediation: 'optional' 
                });

                if (cred && cred.password) {
                    const btnBiometric = document.getElementById('btnBiometric');
                    const textoOriginal = btnBiometric.innerHTML;
                    btnBiometric.innerHTML = '⏳ Verificando en la bóveda...';
                    
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: cred.id, // El llavero guardó el correo completo
                        password: cred.password,
                    });

                    if (error) {
                        showCustomAlert("Error Biométrico", "Las credenciales del llavero ya no son válidas. Ingresa tu contraseña manualmente.", "error");
                        btnBiometric.innerHTML = textoOriginal;
                    } else {
                        btnBiometric.innerHTML = '✅ Autenticado con Éxito';
                        btnBiometric.style.background = '#D1FAE5';
                        btnBiometric.style.color = '#065F46';
                        btnBiometric.style.borderColor = '#10B981';
                        setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
                    }
                } else {
                    showCustomAlert("Atención", "No se encontraron credenciales guardadas para este sitio en tu dispositivo. Inicia sesión con contraseña la primera vez para guardarla.", "info");
                }
            } catch (err) {
                console.warn("Fallo en biometría cancelado por el usuario o error nativo:", err);
            }
        }

        // Iniciar la verificación de seguridad al cargar la página
        window.addEventListener('DOMContentLoaded', verificarSesion);
    </script>
</body>
</html>
